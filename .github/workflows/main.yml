name: Tests

on:
  release:
    types: [ published ]
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        vaultVer: [ "latest", "1.19", "1.18", "1.17" ]

    services:
      vault:
        image: docker.io/hashicorp/vault:${{ matrix.vaultVer }}
        ports:
          - 8200:8200
        options: >-
          --cap-add IPC_LOCK
        env:
          VAULT_DEV_ROOT_TOKEN_ID: testtoken
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          VAULT_LOG_LEVEL: trace
          SKIP_SETCAP: "true"

    steps:
      - id: go-cache-paths
        run: |
          echo "go-build=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "go-mod=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}

      - name: Go Mod Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      - name: Diagnose Vault service container
        run: |
          echo "--- docker ps -a ---"
          docker ps -a || true
          for cid in $(docker ps -a -q); do
            name=$(docker inspect --format '{{.Name}} {{.Config.Image}}' "$cid")
            echo "--- docker logs $cid ($name) ---"
            docker logs "$cid" 2>&1 | tail -50 || true
          done
          echo "--- curl health ---"
          curl -v http://127.0.0.1:8200/v1/sys/health || true

      - name: Wait for Vault to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1; then
              echo "vault is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "vault did not become ready in time" >&2
          exit 1

      - name: Run tests
        run: make test
